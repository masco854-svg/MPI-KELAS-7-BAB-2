<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spepatma Berintan - Hak, Kewajiban & Tanggung Jawab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');
        
        * {
            font-family: 'Poppins', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #dc2626; border-radius: 4px; }

        .snakes-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-short { animation: bounce-short 1s infinite; }
    </style>
</head>
<body class="bg-red-50 text-gray-800 flex flex-col h-screen overflow-hidden select-none">

    <!-- TOP HEADER / STATUS BAR -->
    <header class="bg-gradient-to-r from-red-700 via-red-600 to-red-800 text-white p-3 shadow-md flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center space-x-2">
            <div id="player-avatar" class="w-10 h-10 rounded-full bg-amber-400 border-2 border-white flex items-center justify-center font-bold text-xl text-red-900 shadow">
                👤
            </div>
            <div>
                <div class="flex items-center space-x-1">
                    <h1 id="player-name" class="font-bold text-sm leading-tight max-w-[120px] sm:max-w-[180px] truncate">Siswa Spepatma</h1>
                    <button onclick="editPlayerName()" class="text-xs text-amber-200 hover:text-white"><i class="fas fa-pencil-alt"></i></button>
                </div>
                <p id="player-title" class="text-[10px] sm:text-xs text-amber-300 font-medium truncate max-w-[150px] sm:max-w-[200px]">Lvl 1: Warga Negara Muda</p>
            </div>
        </div>
        <div class="flex items-center space-x-2 sm:space-x-3">
            <div class="bg-red-950/60 border border-amber-400/40 px-2.5 py-1 rounded-full text-xs font-bold text-amber-300 flex items-center shadow-inner">
                ⭐ <span id="player-xp" class="ml-1 text-white">0</span> <span class="text-[10px] ml-0.5 text-amber-300">XP</span>
            </div>
            <button onclick="toggleSound()" id="sound-btn" class="w-8 h-8 bg-red-800/80 hover:bg-red-900 rounded-full flex items-center justify-center text-xs text-amber-200 border border-red-500 shadow active:scale-95">
                <i class="fas fa-volume-up"></i>
            </button>
        </div>
    </header>

    <!-- MAIN APP VIEW CONTAINER -->
    <main id="app-container" class="flex-1 overflow-y-auto p-3 sm:p-5 pb-24 relative">
        <!-- Views loaded dynamically via JS -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-red-100 flex justify-around items-center p-1.5 sm:p-2 z-30 shadow-lg">
        <button onclick="switchTab('map')" id="nav-map" class="nav-btn flex flex-col items-center text-red-600 focus:outline-none py-1 px-2 rounded-lg">
            <i class="fas fa-map-marked-alt text-lg sm:text-xl"></i>
            <span class="text-[10px] sm:text-xs font-semibold mt-0.5">Peta</span>
        </button>
        <button onclick="switchTab('games')" id="nav-games" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600 focus:outline-none py-1 px-2 rounded-lg">
            <i class="fas fa-gamepad text-lg sm:text-xl"></i>
            <span class="text-[10px] sm:text-xs font-semibold mt-0.5">Game</span>
        </button>
        <button onclick="switchTab('material')" id="nav-material" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600 focus:outline-none py-1 px-2 rounded-lg">
            <i class="fas fa-book-open text-lg sm:text-xl"></i>
            <span class="text-[10px] sm:text-xs font-semibold mt-0.5">Materi</span>
        </button>
        <button onclick="switchTab('achievements')" id="nav-achievements" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600 focus:outline-none py-1 px-2 rounded-lg">
            <i class="fas fa-trophy text-lg sm:text-xl"></i>
            <span class="text-[10px] sm:text-xs font-semibold mt-0.5">Prestasi</span>
        </button>
        <button onclick="switchTab('profile')" id="nav-profile" class="nav-btn flex flex-col items-center text-gray-400 hover:text-red-600 focus:outline-none py-1 px-2 rounded-lg">
            <i class="fas fa-user-cog text-lg sm:text-xl"></i>
            <span class="text-[10px] sm:text-xs font-semibold mt-0.5">Profil/Guru</span>
        </button>
    </nav>

    <!-- FULLSCREEN MODAL -->
    <div id="game-modal" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex flex-col p-2 sm:p-4 backdrop-blur-sm overflow-hidden">
        <div class="bg-white rounded-2xl flex-1 flex flex-col overflow-hidden shadow-2xl border border-red-200">
            <div class="bg-gradient-to-r from-red-700 to-red-800 text-white p-3 px-4 flex justify-between items-center shrink-0">
                <div class="flex items-center space-x-2">
                    <span id="game-modal-icon" class="text-xl">🎮</span>
                    <h2 id="game-modal-title" class="font-bold text-sm sm:text-base leading-tight">Mini Game</h2>
                </div>
                <button onclick="closeGameModal()" class="w-8 h-8 rounded-full bg-red-900/60 hover:bg-red-950 flex items-center justify-center text-white text-sm focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="game-modal-body" class="flex-1 overflow-y-auto p-3 sm:p-5 bg-slate-50 relative flex flex-col">
            </div>
        </div>
    </div>

    <!-- AUDIO SYNTHESIZER -->
    <script>
        const AudioEngine = {
            ctx: null,
            enabled: true,
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            },
            playWrong() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }
        };

        function toggleSound() {
            AudioEngine.enabled = !AudioEngine.enabled;
            const btn = document.getElementById('sound-btn');
            btn.innerHTML = AudioEngine.enabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute text-red-300"></i>';
        }
    </script>

    <!-- GAME DATA & BANK SOAL SPEPATMA BERINTAN -->
    <script>
        const BANK_SOAL = [
            { id: 1, level: 1, kategori: "HAK", soal: "Hak atas pendidikan bagi warga negara Indonesia diatur dalam UUD NRI 1945 pasal...", pilihan: ["Pasal 27 ayat (1)", "Pasal 28", "Pasal 31 ayat (1)", "Pasal 30 ayat (1)"], jawaban: 2, penjelasan: "Pasal 31 ayat (1) menegaskan bahwa setiap warga negara berhak mendapatkan pendidikan." },
            { id: 2, level: 2, kategori: "KEWAJIBAN", soal: "Membayar pajak tepat waktu merupakan salah satu bentuk kewajiban warga negara untuk...", pilihan: ["Menambah kekayaan pribadi pejabat", "Mendukung pembangunan nasional dan fasilitas publik", "Mendapatkan penghargaan dari negara", "Menghindari hukuman penjara semata"], jawaban: 1, penjelasan: "Pajak yang dibayar warga negara digunakan untuk membiayai pembangunan fasilitas umum dan layanan publik." },
            { id: 3, level: 3, kategori: "TANGGUNG JAWAB", soal: "Mengikuti kegiatan posyandu dan menjaga kebersihan lingkungan rumah merupakan bentuk tanggung jawab di lingkungan...", pilihan: ["Sekolah", "Masyarakat", "Bangsa dan Negara", "Keluarga"], jawaban: 1, penjelasan: "Menjaga kebersihan dan ketertiban lingkungan sekitar tempat tinggal adalah tanggung jawab sosial di masyarakat." }
        ];

        const LEVEL_CONFIG = [
            { id: 1, name: "📜 KONSEP HAK WARGA NEGARA", icon: "⚖️", minXp: 0, badge: "🏅 Paham Hak", desc: "Pelajari hak-hak konstitusional warga negara menurut UUD 1945." },
            { id: 2, name: "🛡️ KEWAJIBAN WARGA NEGARA", icon: "🛡️", minXp: 100, badge: "🏅 Taat Kewajiban", desc: "Pahami kewajiban dasar warga negara dalam kehidupan berbangsa." },
            { id: 3, name: "🤝 TANGGUNG JAWAB SOSIAL", icon: "🤝", minXp: 250, badge: "🏅 Warga Bertanggung Jawab", desc: "Penerapan tanggung jawab di lingkungan sekolah dan masyarakat." }
        ];

        const AppState = {
            player: {
                name: localStorage.getItem('sp_name') || 'Siswa SMP',
                xp: parseInt(localStorage.getItem('sp_xp')) || 0,
                badges: JSON.parse(localStorage.getItem('sp_badges')) || [],
                reflections: JSON.parse(localStorage.getItem('sp_reflections')) || {},
                roomCode: localStorage.getItem('sp_room') || 'SPEPATMA9'
            },
            currentTab: 'map'
        };

        function saveState() {
            localStorage.setItem('sp_name', AppState.player.name);
            localStorage.setItem('sp_xp', AppState.player.xp);
            localStorage.setItem('sp_badges', JSON.stringify(AppState.player.badges));
            localStorage.setItem('sp_reflections', JSON.stringify(AppState.player.reflections));
            localStorage.setItem('sp_room', AppState.player.roomCode);
            updateHeader();
        }

        function updateHeader() {
            document.getElementById('player-name').innerText = AppState.player.name;
            document.getElementById('player-xp').innerText = AppState.player.xp;
            let currentLvl = LEVEL_CONFIG.slice().reverse().find(l => AppState.player.xp >= l.minXp) || LEVEL_CONFIG[0];
            document.getElementById('player-title').innerText = `Lvl ${currentLvl.id}: ${currentLvl.name.split(' ')[1] || currentLvl.name}`;
        }

        function editPlayerName() {
            const newName = prompt("Masukkan nama panggilanmu:", AppState.player.name);
            if (newName && newName.trim() !== "") {
                AppState.player.name = newName.trim();
                saveState();
            }
        }

        function addXP(amount, badgeToUnlock = null) {
            AppState.player.xp += amount;
            AudioEngine.playCorrect();
            if (badgeToUnlock && !AppState.player.badges.includes(badgeToUnlock)) {
                AppState.player.badges.push(badgeToUnlock);
                setTimeout(() => alert(`🎉 SELAMAT! Lencana Baru Terbuka:\n\n${badgeToUnlock}`), 300);
            }
            saveState();
        }

        function switchTab(tabName) {
            AppState.currentTab = tabName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-red-600');
                btn.classList.add('text-gray-400');
            });
            document.getElementById(`nav-${tabName}`).classList.remove('text-gray-400');
            document.getElementById(`nav-${tabName}`).classList.add('text-red-600');

            const container = document.getElementById('app-container');
            if (tabName === 'map') renderMapView(container);
            else if (tabName === 'games') renderGamesView(container);
            else if (tabName === 'material') renderMaterialView(container);
            else if (tabName === 'achievements') renderAchievementsView(container);
            else if (tabName === 'profile') renderProfileView(container);
        }

        function renderMapView(container) {
            let html = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="bg-gradient-to-r from-red-800 to-red-900 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center">
                        <div>
                            <span class="text-xs text-amber-300 font-semibold uppercase">MPI Spepatma Berintan</span>
                            <h2 class="text-lg font-extrabold">Peta Pembelajaran</h2>
                            <p class="text-xs text-red-200 mt-0.5">Selesaikan misi untuk mengumpulkan XP & Lencana!</p>
                        </div>
                        <div class="text-3xl animate-bounce-short">🗺️</div>
                    </div>
                    <div class="relative pl-6 border-l-4 border-red-300 space-y-6 my-4">
            `;

            LEVEL_CONFIG.forEach(lvl => {
                const isUnlocked = AppState.player.xp >= lvl.minXp;
                const isCompleted = AppState.player.badges.includes(lvl.badge);
                html += `
                    <div class="relative group">
                        <div class="absolute -left-[35px] top-1.5 w-8 h-8 rounded-full border-2 ${isCompleted ? 'bg-amber-400 border-amber-600 text-red-950' : isUnlocked ? 'bg-red-600 border-white text-white' : 'bg-gray-300 border-gray-400 text-gray-600'} flex items-center justify-center font-bold text-xs shadow-md">
                            ${isCompleted ? '✓' : lvl.id}
                        </div>
                        <div class="bg-white p-4 rounded-2xl border-2 ${isUnlocked ? 'border-red-500 shadow-md' : 'border-gray-200 opacity-60'}">
                            <div class="flex items-center space-x-2">
                                <span class="text-2xl">${lvl.icon}</span>
                                <div>
                                    <h3 class="font-bold text-sm ${isUnlocked ? 'text-red-900' : 'text-gray-600'}">${lvl.name}</h3>
                                    <p class="text-[11px] text-gray-500 mt-0.5">${lvl.desc}</p>
                                </div>
                            </div>
                            <div class="mt-3 pt-2 border-t border-gray-100 flex justify-between items-center text-xs">
                                <span class="text-[11px] font-semibold text-amber-600">${lvl.badge}</span>
                                ${isUnlocked 
                                    ? `<button onclick="openLevelPlay(${lvl.id})" class="px-3 py-1.5 bg-red-600 text-white font-bold rounded-xl shadow active:scale-95 text-xs">Jelajahi <i class="fas fa-arrow-right ml-1"></i></button>`
                                    : `<span class="bg-gray-200 text-gray-600 px-2.5 py-1 rounded-lg font-bold text-[10px]"><i class="fas fa-lock"></i> ${lvl.minXp} XP</span>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            });

            html += `</div></div>`;
            container.innerHTML = html;
        }

        function openLevelPlay(levelId) {
            const lvl = LEVEL_CONFIG.find(l => l.id === levelId);
            openGameModal(`${lvl.icon} ${lvl.name}`, (body) => {
                body.innerHTML = `
                    <div class="text-center space-y-3 my-auto py-4">
                        <div class="text-5xl">${lvl.icon}</div>
                        <h3 class="text-lg font-bold text-red-900">${lvl.name}</h3>
                        <p class="text-xs text-gray-600 max-w-xs mx-auto">${lvl.desc}</p>
                        <button onclick="runKuisGame(${levelId})" class="w-full py-3 bg-red-600 text-white font-bold rounded-xl shadow mt-4 text-xs">
                            🎯 Mulai Kuis Misi
                        </button>
                    </div>
                `;
            });
        }

        function renderGamesView(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-3 text-center py-4">
                    <h2 class="text-lg font-extrabold text-red-900">🎮 ZONA MINI GAMES</h2>
                    <p class="text-xs text-gray-600">Pilih mode permainan untuk latihan interaktif!</p>
                    <button onclick="runKuisGame(1)" class="w-full p-4 bg-white border border-red-200 rounded-2xl shadow-sm font-bold text-xs text-red-900 flex items-center justify-between">
                        <span><i class="fas fa-question-circle mr-2 text-amber-500"></i> Kuis Hak & Kewajiban</span>
                        <i class="fas fa-chevron-right text-gray-400"></i>
                    </button>
                </div>
            `;
        }

        function renderMaterialView(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-3">
                    <h2 class="text-lg font-extrabold text-red-900 text-center py-2">📚 RINGKASAN MATERI</h2>
                    <div class="bg-white p-4 rounded-2xl border border-red-200 shadow-sm space-y-2">
                        <h3 class="font-bold text-xs text-red-800">1. Hak Warga Negara</h3>
                        <p class="text-xs text-gray-600">Hak adalah kuasa untuk menerima/menerima sesuatu yang semestinya diterima. Contoh: Hak pendidikan (Pasal 31 UUD 1945).</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-red-200 shadow-sm space-y-2">
                        <h3 class="font-bold text-xs text-red-800">2. Kewajiban Warga Negara</h3>
                        <p class="text-xs text-gray-600">Kewajiban adalah beban untuk memberikan sesuatu yang seharusnya dibiarkan/diberikan oleh pihak tertentu. Contoh: Membayar pajak & menaati hukum.</p>
                    </div>
                </div>
            `;
        }

        function renderAchievementsView(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-3 text-center py-4">
                    <h2 class="text-lg font-extrabold text-amber-600">🏆 LENCANA & PRESTASI</h2>
                    <p class="text-xs text-gray-600">Total XP yang berhasil dikumpulkan: <b class="text-red-700">${AppState.player.xp} XP</b></p>
                </div>
            `;
        }

        function renderProfileView(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-red-200 shadow-sm text-center space-y-2">
                        <div class="w-16 h-16 bg-amber-400 text-red-900 font-bold text-3xl rounded-full flex items-center justify-center mx-auto">👤</div>
                        <h2 class="font-extrabold text-base text-gray-800">${AppState.player.name}</h2>
                        <button onclick="editPlayerName()" class="px-3 py-1 bg-gray-100 text-gray-700 text-xs font-bold rounded-lg">Ubah Nama</button>
                    </div>
                </div>
            `;
        }

        function openGameModal(title, contentCallback) {
            document.getElementById('game-modal-title').innerText = title;
            const body = document.getElementById('game-modal-body');
            body.innerHTML = '';
            contentCallback(body);
            document.getElementById('game-modal').classList.remove('hidden');
        }

        function closeGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
        }

        function runKuisGame(levelId) {
            const q = BANK_SOAL.find(item => item.level === levelId) || BANK_SOAL[0];
            openGameModal("🔎 KUIS INTERAKTIF", (body) => {
                let html = `
                    <div class="space-y-4 my-auto">
                        <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-xl">
                            <span class="text-xs font-bold text-amber-800 uppercase">Kategori: ${q.kategori}</span>
                            <p class="text-xs text-amber-950 font-medium mt-1">${q.soal}</p>
                        </div>
                        <div class="space-y-2">
                `;
                q.pilihan.forEach((pil, idx) => {
                    html += `
                        <button onclick="checkAnswer(${idx}, ${q.jawaban}, '${q.penjelasan.replace(/'/g, "\\'")}', ${levelId})" class="w-full text-left p-3 rounded-xl border border-gray-200 bg-white hover:bg-red-50 text-xs font-medium text-gray-800 shadow-sm">
                            ${pil}
                        </button>
                    `;
                });
                html += `</div></div>`;
                body.innerHTML = html;
            });
        }

        function checkAnswer(chosen, correct, explanation, levelId) {
            if (chosen === correct) {
                addXP(20, LEVEL_CONFIG.find(l => l.id === levelId)?.badge);
                alert(`🎉 BENAR! (+20 XP)\n\nPenjelasan: ${explanation}`);
                closeGameModal();
            } else {
                AudioEngine.playWrong();
                alert(`💡 BELUM TEPAT!\n\nPenjelasan: ${explanation}`);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeader();
            switchTab('map');
        });
    </script>
</body>
</html>
